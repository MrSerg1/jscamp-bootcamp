name: '05 - CI'

on:
  push:
    branches: [main]
    paths:
      - '12-ejercicio-cicd/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - '12-ejercicio-cicd/**'
      - '.github/**'

jobs:
  frontend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Lint frontend
        run: pnpm lint:frontend

  frontend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Test frontend
        run: pnpm test:frontend

  backend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Lint backend
        run: pnpm lint:backend

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Test backend
        run: pnpm test:backend

  frontend-build:
    needs: [frontend-lint, frontend-test]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Build frontend
        run: pnpm build:frontend

  backend-build:
    needs: [backend-lint, backend-test]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
      - name: Build backend
        run: pnpm build:backend

  frontend-test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: 12-ejercicio-cicd
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar pnpm y Node.js
        uses: ./12-ejercicio-cicd/.github/actions/setup-pnpm-ci-cd
        with:
          node-version: ${{ matrix.node }}
      - name: Test frontend
        run: pnpm test:frontend
