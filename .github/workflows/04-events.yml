name: '04 - Events'

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      REPO: ${{ github.repository }}
    steps:
      - name: Inspeccionar evento
        run: |
          echo "Evento: $EVENT_NAME"
          echo "Número de issue: $ISSUE_NUMBER"
          echo "Cuerpo del comentario: $COMMENT_BODY"

      - name: Comentar en la issue como bot
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "¡Gracias por tu aporte! He recibido tu issue y le echaré un vistazo pronto."
