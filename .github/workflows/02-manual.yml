name: '02 - Manual'

on:
  workflow_dispatch:
    inputs:
      logging_level:
        description: 'Nivel de log'
        required: true
        default: 'info'
      environment:
        description: 'Entorno de despliegue'
        required: true
      dry_run:
        description: 'Ejecutar sin aplicar cambios'
        type: boolean
        required: false
        default: false
      reason:
        description: 'Motivo de la ejecución'
        required: false
        default: 'Manual execution'

jobs:
  manual:
    runs-on: ubuntu-24.04
    env:
      LOGGING_LEVEL: ${{ inputs.logging_level }}
      ENVIRONMENT: ${{ inputs.environment }}
      DRY_RUN: ${{ inputs.dry_run }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Mostrar inputs
        run: |
          echo "logging_level: $LOGGING_LEVEL"
          echo "environment: $ENVIRONMENT"
          echo "dry_run: $DRY_RUN"
          echo "reason: $REASON"

      - name: Deploy
        if: env.DRY_RUN == 'false'
        run: echo "Deploying to $ENVIRONMENT"

      - name: Dry run
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run activo: no se aplica ningún cambio"
